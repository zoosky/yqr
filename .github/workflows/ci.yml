name: CI

# Runs on every push and every pull request, with no path filter.
#
# It used to skip anything that touched no Rust, which was cheap and made
# this check *unrequirable*: a docs-only pull request showed no check at
# all, so a branch rule requiring it would wait on a run that never
# starts. A check that is sometimes absent cannot gate anything, and
# gating is what it is for. The cost is about a minute of cached build on
# a change that could not have broken the build.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          # Feature f049: the lib's wasm compatibility is CI-pinned.
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      # Features f046-f048: the lib lints, tests and compiles without the
      # CLI, JSON Schema and serde dependency graphs (and in the schema-only editor
      # profile), and clap, jsonschema, serde_json and serde stay out of the minimal
      # graph entirely. `cargo tree` writes to a file as its own command so a
      # tool failure fails the step instead of handing grep empty input, and
      # grep's exit code is inspected explicitly so a grep error (exit 2)
      # fails the gate rather than reading as "no match".
      - name: Check lib without default features
        run: |
          cargo clippy --lib --no-default-features --locked -- -D warnings
          cargo test --lib --no-default-features --locked
          cargo check --lib --no-default-features --features schema --locked
          cargo check --lib --no-default-features --features serde --locked
          cargo tree --no-default-features --locked -e normal --prefix none > /tmp/lib-deps.txt
          rc=0
          grep -E '^(clap|jsonschema|serde_json|serde) ' /tmp/lib-deps.txt || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "error: a gated dependency is in the no-default-features graph" >&2
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "error: the dependency guard's grep failed (exit $rc)" >&2
            exit 1
          fi

      # Feature f049: the lib compiles for wasm32 by contract, not by
      # accident -- a dependency bump or new lib code that breaks the target
      # fails the PR here, not at the first wasm consumer. Checked in the
      # feature states a browser consumer builds.
      - name: Check lib for wasm32 (editor profiles)
        run: |
          cargo check --lib --target wasm32-unknown-unknown --no-default-features --locked
          cargo check --lib --target wasm32-unknown-unknown --no-default-features --features schema --locked
          cargo check --lib --target wasm32-unknown-unknown --no-default-features --features serde --locked

      # Feature f049: the bindings crate lints, builds, behaves at run time
      # (one read, one byte-preserving edit, one validate, inside Node's
      # wasm runtime), and stays under its size budget. Measured 676,586
      # bytes optimized on 2026-11-07; the generous ceiling catches drift,
      # not noise.
      - name: wasm bindings (clippy, build, smoke test, size budget)
        run: |
          cargo clippy -p yqr-wasm --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          wasm-pack build yqr-wasm --target web --release
          wasm-pack test --node yqr-wasm
          size=$(stat -c %s yqr-wasm/pkg/yqr_wasm_bg.wasm)
          echo "optimized wasm size: $size bytes"
          if [ "$size" -gt 900000 ]; then
            echo "error: yqr_wasm_bg.wasm is $size bytes, over the 900000-byte budget" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --all-targets --locked

      # Feature-gated code (the fidelity engine backend) is invisible to the
      # default-feature run; without this pass its tests never execute in CI.
      - name: Test (all features)
        run: cargo test --all-targets --all-features --locked
