name: Default
description: Default Accent CMS theme - showcases Sass, utility CSS, icons, and typography
version: "1.0.0"
author: Accent CMS
license: MIT
# The canonical components are the accent 0.26 default theme's own
# implementations, copied at the pinned release (v0.26.0, site-dev
# default theme) so the markup contract (data-canonical / data-part)
# and attribute names match what `accent validate` checks. The site
# components beside them carry the home page's structures (f042).
assets:
  css:
    - css/main.scss
    - css/editions.css
    - css/utilities.css
  js:
    - js/island-loader.js
    - js/islands/copy-code.js
    - js/tabs.js
    - js/search-keys.js
    - js/nav-menu.js
styling:
  sass:
    enabled: true
    load_paths:
      - css
  utilities:
    enabled: true
    scan:
      - templates/**/*.jinja
    output: css/utilities.css
    icons: true
    typography: true
    extend:
      colors:
        brand: "#c68a3e"
        accent: "#4fb3ac"
  processing:
    minify: true
