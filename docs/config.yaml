# Accent CMS configuration for the yqr **public** website.
#
# Content is ./content and nothing else: the home page and the usage
# documentation. The spec tree is deliberately not here -- it is written for
# contributors, uses internal identifiers, and records decisions that were
# later reversed, so publishing it alongside the guide made `llms-full.txt`
# mostly spec text. It has its own local-only site at ../specs/config.yaml,
# port 4401. See `yqr-f021`.
#
# The home page is a real CMS page, so serve and build agree: the
# hand-authored design lives in themes/default/templates/home.html.jinja
# and the page body in content/index.md (frontmatter `template: home`,
# `process.markdown: false` -- the HTML passes through untouched). The
# theme provides the header menu and the footer; the rest of the site uses
# the standard theme, restyled with the home page's ink/brass/teal tokens.
#
# Requires accent >= v0.24.0, the version pages.yml pins. The site renders
# identically under v0.23.1 -- every built page is byte-for-byte the same
# apart from the version stamp in the footer -- but two v0.24.0 fixes to the
# search index are load-bearing here, so the floor moves with the pin:
# raw HTML in a page body is no longer tokenized as searchable text, which
# is what kept `<!-- Feature fNNN -->` traceability comments (ground rule 19)
# and the home page's leading comment block out of _search/index.json, and
# indexed titles and snippets are escaped rather than concatenated into
# innerHTML.
#
# The site is served under the /yqr/ sub-path on GitHub Pages; accent
# derives the deployment path prefix from the site.url path component
# below, emits every internal URL prefixed, and fails the build if an
# unprefixed root-absolute link slips through. Since v0.23.1 the dev server
# applies the same prefix (serve/build parity): `accent serve` redirects /
# to /yqr/ and mounts the site there. Moving to a custom domain later just
# means changing site.url -- the prefix disappears with it.
#
# Local development:  cd docs && accent serve   (site served under /yqr/)
# Static build:       cd docs && accent build --clean
# Sub-path preview:   accent serve-static --dir output   (mounts under /yqr)
# (accent build takes the base URL from site.url below; CI passes
# --base-url explicitly with the same value, so the two produce identical
# output.)
#
# Since v0.24.0 both `accent serve` and `accent serve-static` bind HTTPS
# with a cached self-signed certificate and negotiate HTTP/2, so the local
# URL is https://127.0.0.1:4400/yqr/ and the browser warns once until the
# certificate is trusted (the server prints the install command on first
# start). Pass --no-tls to either command for the old cleartext behaviour --
# needed by anything that curls the dev server, though nothing in this
# repository does.

server:
  address: "127.0.0.1"
  port: 4400

content:
  directory: "./content"

theme:
  name: "default"
  directory: "./themes"

site:
  name: "yqr"
  url: https://zoosky.github.io/yqr
  description: "yqr -- a jq-style query and editing tool for YAML with byte-fidelity reads and surgical writes."
  # Site-wide <meta> defaults; the theme's head_meta partial emits each entry
  # on every page, and an entry here overrides the standard tag of the same
  # key (Open Graph parsers honour the first occurrence).
  meta:
    # Google Search Console ownership verification -- keep this tag in place
    # even after verification succeeds, or the site loses its verified status.
    google-site-verification: "yS18C91qoSaQvcIS0JI33YvZ-KKx_kDXfJarTH7dqGw"
    # Social card. Without an image a shared link renders as a bare grey
    # stub, so this is set site-wide, so every page unfurls.
    #
    # Per page, the frontmatter key is `image:` (it populates the
    # `page.social_image` template variable, which is what the theme's
    # head_meta partial reads -- the variable name is not itself a
    # frontmatter key). There is no site-level equivalent of `image:`, so
    # site-wide coverage has to go through this open meta map, which also
    # lets twitter:card be upgraded from the default `summary`. A key here
    # overrides the standard tag, so a per-page `image:` would be ignored
    # while these entries exist.
    #
    # Open Graph requires an absolute URL, so this cannot use the path
    # prefix helper and repeats site.url -- change both together. The image
    # is built from themes/default/assets/og-image.svg; regenerate with
    #   rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png
    og:image: "https://zoosky.github.io/yqr/theme/assets/og-image.png"
    og:image:width: "1200"
    og:image:height: "630"
    og:image:alt: "yqr -- jq for YAML. A terminal showing an edit that changes one value and leaves the surrounding comment untouched."
    twitter:image: "https://zoosky.github.io/yqr/theme/assets/og-image.png"
    twitter:card: "summary_large_image"

# No `build:` section. v0.24.0 added two blocks under it that carry serve-time
# behaviour into a static build, and neither reaches this deployment:
#
#   build.header_artifacts  emits _headers (Netlify/Cloudflare Pages) or
#                           .htaccess (Apache) from the `http_headers` config.
#   build.routing           adds error_document / canonical_host / redirects
#                           to the generated .htaccess (Apache only).
#
# GitHub Pages reads neither file, and this site sets no `http_headers` to
# project in the first place, so both would emit dead bytes into the output
# tree that rsync then deploys. They become relevant only if the site moves to
# a host that honours one of the two dialects.

code:
  theme: "base16-ocean.dark"

markdown:
  tables: true
  footnotes: true
  strikethrough: true
  tasklists: true
  heading_attributes: true
  wikilinks: true
  smart_punctuation: true
  math: true
  definition_lists: true
  gfm: true
  superscript: true
  subscript: true
  metadata_blocks: true

# Server-side diagram rendering so `accent build` output is self-contained.
diagrams:
  render_mode: server

# LLM crawler discovery files (llms.txt / llms-full.txt).
llms:
  enabled: true
  # This block is the whole of what a reader gets who fetches llms.txt and
  # nothing else, so it carries the synopsis rather than describing the site:
  # how to install yqr, how to invoke it, what its exit codes mean, and where
  # the source lives. Before `yqr-f021` none of that appeared in either file.
  description: |
    yqr is a jq-style query and editing tool for YAML, written in Rust.
    Reads are byte-preserving by default: nodes you do not touch are emitted
    as their original bytes, so comments, quoting, indentation and line
    endings survive. The write tier changes only the bytes the filter targets,
    or refuses.

    Install: cargo install yqr
    Invoke:  yqr [-r] [-i] [-N] '<filter>' [file]      (stdin when file is omitted)
             yqr validate [--strict] <file>...

    Flags:
      -r, --raw-output   print a string's value, not its YAML quoting
      -i, --in-place     write the edit back to the file (mutating filters only)
      -N, --normalize    re-serialize instead of preserving bytes

    Exit codes:
      0  success
      1  validate found a problem in the file
      3  the filter could not be lexed or parsed
      5  runtime or I/O error, including a refused edit

    Source:    https://github.com/zoosky/yqr
    Package:   https://crates.io/crates/yqr
  exclude_paths:
    - "/tags/*"

search:
  exclude:
    - "/404"
    - "/tags/*"

dev:
  hot_reload: true
  browser_reload: true
  debounce_ms: 50
