# Accent CMS configuration for the yqr website.
#
# The site combines two content sources:
#   - ./content        (this directory) -- home page and usage documentation
#   - ../specs         (mounted at /specs) -- the feature/bug/architecture
#                      spec tree, served as flat-file pages without any
#                      restructuring
#
# The home page is a real CMS page, so serve and build agree: the
# hand-authored design lives in themes/default/templates/home.html.jinja
# and the page body in content/index.md (frontmatter `template: home`,
# `process.markdown: false` -- the HTML passes through untouched). The
# theme provides the header menu and the footer; the rest of the site uses
# the standard theme, restyled with the home page's ink/brass/teal tokens.
#
# Requires accent >= v0.23.1. The site is served under the /yqr/ sub-path
# on GitHub Pages; accent derives the deployment path prefix from the
# site.url path component below, emits every internal URL prefixed, and
# fails the build if an unprefixed root-absolute link slips through.
# Since v0.23.1 the dev server applies the same prefix (serve/build
# parity): `accent serve` redirects / to /yqr/ and mounts the site there.
# Moving to a custom domain later just means changing site.url -- the
# prefix disappears with it.
#
# Local development:  cd docs && accent serve   (site served under /yqr/)
# Static build:       cd docs && accent build --clean
# Sub-path preview:   accent serve-static --dir output   (mounts under /yqr)
# (accent build takes the base URL from site.url below; CI passes
# --base-url explicitly with the same value, so the two produce identical
# output.)

server:
  address: "127.0.0.1"
  port: 4400

content:
  directory: "./content"
  mounts:
    # Serve the repository's spec tree as-is. Every category directory
    # (features, bugs, architecture, implementation, research) carries a
    # README.md index so it appears as a sidebar section.
    - source: ../specs
      mount: /specs
      default_template: docs

theme:
  name: "default"
  directory: "./themes"

site:
  name: "yqr"
  url: https://zoosky.github.io/yqr
  description: "yqr -- a jq-style query and editing tool for YAML with byte-fidelity reads and surgical writes."
  # Site-wide <meta> defaults; the theme's head_meta partial emits each entry
  # on every page, and an entry here overrides the standard tag of the same
  # key (Open Graph parsers honour the first occurrence).
  meta:
    # Google Search Console ownership verification -- keep this tag in place
    # even after verification succeeds, or the site loses its verified status.
    google-site-verification: "yS18C91qoSaQvcIS0JI33YvZ-KKx_kDXfJarTH7dqGw"
    # Social card. Without an image a shared link renders as a bare grey
    # stub, so this is set site-wide -- every page unfurls, including the
    # mounted spec tree.
    #
    # Per page, the frontmatter key is `image:` (it populates the
    # `page.social_image` template variable, which is what the theme's
    # head_meta partial reads -- the variable name is not itself a
    # frontmatter key). There is no site-level equivalent of `image:`, so
    # site-wide coverage has to go through this open meta map, which also
    # lets twitter:card be upgraded from the default `summary`. A key here
    # overrides the standard tag, so a per-page `image:` would be ignored
    # while these entries exist.
    #
    # Open Graph requires an absolute URL, so this cannot use the path
    # prefix helper and repeats site.url -- change both together. The image
    # is built from themes/default/assets/og-image.svg; regenerate with
    #   rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png
    og:image: "https://zoosky.github.io/yqr/theme/assets/og-image.png"
    og:image:width: "1200"
    og:image:height: "630"
    og:image:alt: "yqr -- jq for YAML. A terminal showing an edit that changes one value and leaves the surrounding comment untouched."
    twitter:image: "https://zoosky.github.io/yqr/theme/assets/og-image.png"
    twitter:card: "summary_large_image"

code:
  theme: "base16-ocean.dark"

markdown:
  tables: true
  footnotes: true
  strikethrough: true
  tasklists: true
  heading_attributes: true
  wikilinks: true
  smart_punctuation: true
  math: true
  definition_lists: true
  gfm: true
  superscript: true
  subscript: true
  metadata_blocks: true

# Server-side diagram rendering so `accent build` output is self-contained.
diagrams:
  render_mode: server

# LLM crawler discovery files (llms.txt / llms-full.txt).
llms:
  enabled: true
  description: |
    yqr is a jq-style query and editing tool for YAML written in Rust.
    Reads are byte-preserving by default; the write tier performs surgical
    edits that change only the targeted bytes. This site serves the usage
    documentation and the full feature/bug/architecture spec tree.
  exclude_paths:
    - "/tags/*"

search:
  exclude:
    - "/404"
    - "/tags/*"

dev:
  hot_reload: true
  browser_reload: true
  debounce_ms: 50
