[package]
name = "yqr"
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
description = "A jq-style CLI for YAML: query and surgically edit while preserving comments, quoting, and formatting byte-for-byte"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zoosky/yqr"
readme = "README.md"
keywords = ["yaml", "jq", "cli", "query", "filter"]
categories = ["command-line-utilities", "parsing"]
# Dev-only files kept out of the published crate.
exclude = [".agent/", ".github/", "specs/", "AGENT.md"]

[[bin]]
name = "yqr"
path = "src/main.rs"

[lib]
name = "yqr"
path = "src/lib.rs"

[[bench]]
name = "eval"
harness = false

# Drives the shared real-world corpus (tests/corpus/) — the same cases the
# validation suite asserts against — plus scale variants.
[[bench]]
name = "corpus_bench"
harness = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# noyalib is yqr's YAML engine: the parser/emitter for the classic pipeline and
# the lossless CST behind the fidelity engine (src/fidelity/noyalib.rs). It is
# converted to yqr's own `Value` model (src/value.rs) at the parse/emit
# boundary, so the engine is a swappable implementation detail. Pinned to the
# crates.io 0.0.21 release: 0.0.18 brought the CST mutation API bug b004
# catalogued as missing, 0.0.19 shipped yqr's remove()-trivia fix, and 0.0.21
# fixed three silent-corruption cases in the mutators plus two Emit defects,
# two of which were reachable from yqr's own assignment path. (0.0.20 was
# merged upstream but never tagged, so it never reached crates.io; the
# published sequence is 0.0.19 -> 0.0.21.) See research r002 and bugs
# b002/b004/b008/b009.
noyalib = "0.0.21"
# Backs `value::Mapping` — an insertion-ordered, `Value`-keyed map (the same
# shape yqr's evaluator has always used). noyalib already depends on indexmap.
indexmap = "2"

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
lto = "thin"
strip = true
