[package]
name = "yqr"
version = "0.8.1"
edition = "2024"
rust-version = "1.97"
description = "A jq-style CLI for YAML: query and surgically edit while preserving comments, quoting, and formatting byte-for-byte"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zoosky/yqr"
# crates.io renders `repository` on its own, but a reader landing there had no
# route to the guide without one of these: `homepage` is the task-oriented site
# (install, fidelity, Kubernetes recipes, validate), `documentation` the library
# API. Aggregators read both -- lib.rs has already referred traffic from this
# metadata -- so leaving them unset cost the site its main discovery surface.
homepage = "https://zoosky.github.io/yqr/"
documentation = "https://docs.rs/yqr"
readme = "README.md"
keywords = ["yaml", "jq", "cli", "query", "filter"]
categories = ["command-line-utilities", "parsing"]
# Dev-only files kept out of the published crate: `docs/` is the website (its
# theme assets alone outweigh the source), and CLAUDE.md is a symlink to
# AGENT.md that needs its own entry, since exclude matches paths rather than
# the files behind them. Guarded by the package-contents gate in local-ci.sh.
exclude = [".agent/", ".github/", "docs/", "specs/", "tests/data/", "AGENT.md", "CLAUDE.md"]

[[bin]]
name = "yqr"
path = "src/main.rs"

[lib]
name = "yqr"
path = "src/lib.rs"

[[bench]]
name = "eval"
harness = false

# Drives the shared real-world corpus (tests/corpus/) — the same cases the
# validation suite asserts against — plus scale variants.
[[bench]]
name = "corpus_bench"
harness = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# noyalib is yqr's YAML engine: the parser/emitter for the classic pipeline and
# the lossless CST behind the fidelity engine (src/fidelity/noyalib.rs). It is
# converted to yqr's own `Value` model (src/value.rs) at the parse/emit
# boundary, so the engine is a swappable implementation detail. Pinned to the
# crates.io 0.0.45 release, which carries noyalib#442: a leading comment is
# anchored on the entry's key line rather than on its value, so a head comment
# above a block-valued key reads and writes (b033, f037). 0.0.44 was the first
# release carrying yqr's four earlier upstream PRs: noyalib#427 stops an
# insert at the last line its anchor entry owns (b032),
# noyalib#437 makes a kept block scalar's blank lines content rather than the
# anchor's trivia (b034) and treats a tab-indented comment alike after a plain
# and a quoted scalar, noyalib#422 has a replacement adopt the document's line
# break (b030, so a multi-line write into a CRLF file is written instead of
# refused), and noyalib#424 keeps a scalar's indent when it is written over a
# block collection (b029 -- yqr's refusal stays, see f036). noyalib#426 also
# lands and changed nothing here: b033 was unmoved, as its filing predicted.
# 0.0.42 and 0.0.43 are lockstep releases for the
# language server's editor extension: every source file of the published crate
# is byte-identical to 0.0.41's (f034). 0.0.40 fixes the serializer's spelling
# of a tag a `%TAG` directive resolves and the CST formatter's handling of a
# mapping used as an explicit key and of keep-chomped scalars; neither path is
# yqr's (a tag is lowered away at the `Value` boundary, and yqr does not use the
# formatter), so nothing observable moved, and 0.0.41 has no core change
# (f031). 0.0.36 carries yqr's noyalib#408 (b028): the CST
# stream parser locates an error in the stream, as the typed loaders do, so
# `validate` reads positions straight from the parser. 0.0.38 diagnoses a
# cross-document alias. Two files that read on 0.0.34 are refused now, both
# pinned in the CLI suite: a tab before `-` on the first line (0.0.36) and
# a `!!!int` tag (0.0.38). 0.0.33 locates a stringified-key
# collision (`Error::KeyCollisionAt`), which `validate` reports as a
# positioned Y102, and adds bracket-quoted key segments to the path grammar,
# the upstream half of the dotted-key addressing limit (f007 s6); its emitter
# fixes change `--normalize` output for block scalars. 0.0.31 was the first
# carrying yqr's noyalib#373: configurable CST entry points
# (`parse_*_with_config`) and a `Document` that keeps its configuration across
# re-parses, which let every path disable the alias-to-anchor ratio heuristic
# that refused merge-heavy values files (b025). 0.0.29's mutators refuse writes
# into alias-shared values (#338) -- yqr writes anchor definitions itself
# (src/fidelity/write/anchor.rs, also closing b026) -- and its `from_str`
# refuses multi-document streams (#351), absorbed via `load_all_with_config`.
# Every bug yqr has filed against this engine is fixed in a published release:
# b011-b014 in 0.0.25, b015 in 0.0.26, b016 in 0.0.27, b021-b022 in 0.0.28,
# b025 in 0.0.31, b028 in 0.0.36, b032 and b034 in 0.0.44, b033 in 0.0.45.
# Each pin and what it bought is in features f013-f029, f031, f034-f035 and
# f037; see research r002 and the bug specs.
noyalib = "0.0.45"
# Backs `value::Mapping` — an insertion-ordered, `Value`-keyed map (the same
# shape yqr's evaluator has always used). noyalib already depends on indexmap.
indexmap = "2"

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
lto = "thin"
strip = true
