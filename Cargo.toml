[package]
name = "yqr"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
description = "A jq-style command-line processor for YAML"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zoosky/yqr"
readme = "README.md"
keywords = ["yaml", "jq", "cli", "query", "filter"]
categories = ["command-line-utilities", "parsing"]
# Dev-only files kept out of the published crate.
exclude = [".agent/", ".github/", "specs/", "AGENT.md"]

[[bin]]
name = "yqr"
path = "src/main.rs"

[lib]
name = "yqr"
path = "src/lib.rs"

[[bench]]
name = "eval"
harness = false

# Drives the shared real-world corpus (tests/corpus/) — the same cases the
# validation suite asserts against — plus scale variants.
[[bench]]
name = "corpus_bench"
harness = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rust-yaml = "1.1.0"
# Fidelity engine backend (src/fidelity/noyalib.rs) and comparison backend for
# the round-trip harness (tests/fidelity.rs). Sourced from the `zoosky/noyalib`
# fork's `feat/fidelity-span-fixes` branch, which carries our submitted upstream
# fixes on top of the 0.0.13 release (span_at implicit-null / keep-chomped /
# block-collection / alias resolve-through, loader key-collision diagnostic, and
# scanner lone-CR — deficiencies 2.2-2.7), so yqr ships the fixed engine ahead
# of an upstream release. Enabled by default via the `backend-noyalib` feature.
# See research r002 and bug b002.
noyalib = { git = "https://github.com/zoosky/noyalib.git", branch = "feat/fidelity-span-fixes", optional = true }
# Fidelity engine backend A (src/fidelity/rustyaml.rs) and comparison backend
# for the round-trip harness: our rust-yaml fork's source-preserving
# `RoundTripDocument` API. It is the *same* crate yqr already depends on from
# crates.io, brought in under a distinct name from the fork branch so the
# classic (crates.io) pipeline is untouched. Enabled by default via the
# `backend-rust-yaml` feature. See bug b001 §8 and impl m002 §7.1.
rust-yaml-rt = { package = "rust-yaml", git = "https://github.com/zoosky/rust-yaml.git", branch = "feat/roundtrip-document", optional = true }

[dev-dependencies]
criterion = "0.8.2"
# The fidelity harness drives rust-yaml's load/dump path directly. Integration
# tests compile as a separate crate and do not inherit the library's normal
# dependencies, so rust-yaml is declared here as well.
rust-yaml = "1.1.0"

[features]
# Both fidelity engines ship in the default build so `--engine noyalib` and
# `--engine rust-yaml` are switchable at runtime in one binary (engine parity).
# Build with `--no-default-features` for a minimal binary that carries neither
# backend (the classic re-serializing pipeline still works; `--engine` then
# reports the backend as unavailable).
default = ["backend-noyalib", "backend-rust-yaml"]
# Adds the noyalib CST backend (src/fidelity/noyalib.rs) to the fidelity engine
# and the round-trip harness.
backend-noyalib = ["dep:noyalib"]
# Adds the rust-yaml fork's RoundTripDocument backend (backend A) to the
# fidelity engine and harness.
backend-rust-yaml = ["dep:rust-yaml-rt"]

[profile.release]
lto = "thin"
strip = true
